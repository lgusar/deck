[project]
name = "deck"
version = "0.1.0"
description = "TUI tool to monitor servers"
readme = "README.md"
authors = [{ name = "Lovre Gusar", email = "lovreg79@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.22.0",
    "pydantic>=2.13.3",
    "textual>=8.2.4",
    "textual-dev>=1.8.0",
    "typer>=0.25.0",
]

[project.scripts]
deck = "deck.main:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
